<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Tracker">
<title>Lift Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#6a7280;--line:#e2e5ea;--acc:#1f6feb;--accink:#fff;--ok:#1a7f45;--bad:#c4361f;--okbg:#e6f5ec;--badbg:#fbe9e5;--hi:#fff6d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--ink:#eef0f4;--mute:#98a1b0;--line:#2b303a;--acc:#4c8dff;--accink:#08101f;--ok:#4cc982;--bad:#ff7a63;--okbg:#14291d;--badbg:#321a15;--hi:#2f2a14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px calc(120px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:15px;margin:0 0 12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600}
.seg button.on{background:var(--acc);color:var(--accink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-size:14px;color:var(--mute);font-weight:600}
.lift{font-size:20px;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.stepper .lbl{font-size:14px;color:var(--mute);min-width:84px}
.stepper .val{flex:1;text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper .val small{font-size:15px;color:var(--mute);font-weight:600}
.btn{min-height:50px;min-width:62px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:24px;font-weight:700}
.btn:active{filter:brightness(.92)}
.primary{display:block;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font:inherit;font-size:19px;font-weight:700;margin-top:6px}
.ghost{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.danger{color:var(--bad)}
.note{font-size:15px;border-radius:10px;padding:8px 10px;margin-top:10px}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
.acc{background:var(--hi);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
td.n{font-variant-numeric:tabular-nums;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;min-height:52px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;font-weight:600;border-radius:10px}
.tabs button.on{color:var(--acc)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:736px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;z-index:4}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;min-width:74px}
.timer button{min-height:40px;border:0;border-radius:9px;padding:0 12px;background:rgba(127,127,127,.35);color:inherit;font:inherit;font-weight:600}
input[type=number]{width:120px;min-height:46px;font:inherit;font-size:20px;text-align:right;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:110px;font:13px/1.3 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}
.status{font-size:13px;color:var(--mute);margin-top:6px}
.hdr{display:flex;justify-content:space-between;align-items:baseline}
.pill{font-size:13px;font-weight:700;background:var(--acc);color:var(--accink);border-radius:99px;padding:3px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const r25=x=>Math.round(x/2.5)*2.5;
const fmt=x=>String(Math.round(x*10)/10);
const KEY="lifttracker.v1";

/* ---------- programs ---------- */
const PROGS={
 a:{key:"a",name:"Anthony",sub:"4 days · GZCLP",dpw:4,lastWeek:12,mode:"stage",
  startLifts:["Squat","Bench Press","Overhead Press","Deadlift"],
  lifts:{"Squat":{jump:5},"Bench Press":{jump:2.5},"Overhead Press":{jump:2.5},"Deadlift":{jump:5}},
  tiers:{T1:{schemes:["5×3+","6×2+","10×1+"],targets:[3,2,1],reset:.85,dbl:true},
         T2:{schemes:["3×10","3×8","3×6"],targets:[10,8,6],reset:.9,dbl:false}},
  days:[[["Squat","T1"],["Bench Press","T2"]],[["Overhead Press","T1"],["Deadlift","T2"]],[["Bench Press","T1"],["Squat","T2"]],[["Deadlift","T1"],["Overhead Press","T2"]]],
  accs:["One-arm DB row 3×15+, DB lateral raise 3×15+","Chin-ups 3 sets near failure, DB curl 3×15+, plank","Barbell row 3×10–15, DB overhead triceps extension 3×15+","Step-ups 3×12/leg, rear-delt DB raise 3×15+, calf raise off box"],
  plan(week,d){return{title:"Day "+(d+1),ex:this.days[d],acc:this.accs[d]}},
  slots(){const s=new Set(),o=[];this.days.flat().forEach(x=>{const k=x.join("|");if(!s.has(k)){s.add(k);o.push(x)}});return o},
  startW(lift,tier,b){return tier==="T1"?b:r25(b*.75)},
  help:"Enter the weight you can lift for 3 hard reps on your T1 (top set) for each lift. The T2 volume weight is set to 75% of that automatically. Week 1 is a ramp-up: build up slowly and find those numbers first."},
 g:{key:"g",name:"Julie",sub:"3 days · full body",dpw:3,lastWeek:12,mode:"miss",
  startLifts:["Squat","Bench Press","Barbell Row","Deadlift","Overhead Press","Hip Thrust"],
  lifts:{"Squat":{jump:2.5,t:5},"Bench Press":{jump:2.5,t:8},"Barbell Row":{jump:2.5,t:8},"Deadlift":{jump:5,t:5},"Overhead Press":{jump:2.5,t:8},"Hip Thrust":{jump:5,t:10}},
  W:{A:["Squat","Bench Press","Barbell Row"],B:["Deadlift","Overhead Press","Hip Thrust"]},
  accs:{A:"Box step-ups 3×10/leg, DB lateral raise 3×15, plank 3×30–45 s",B:"Split squat (back foot on box) 3×10/leg, rear-delt DB raise 3×15, calf raise off box 3×15"},
  plan(week,d){const L=(week%2===1?["A","B","A"]:["B","A","B"])[d];return{title:"Day "+(d+1)+" · Workout "+L,ex:this.W[L].map(l=>[l,""]),acc:this.accs[L]}},
  slots(){return this.startLifts.map(l=>[l,""])},
  startW(lift,tier,b){return b},
  help:"Enter the heaviest weight you can lift for the test reps (5 for squat/deadlift, 8 for bench/row/press, 10 for hip thrust) with 2–3 reps still in the tank. Week 1 is a ramp-up to find those. Rows only for pulling — no chin-ups or pull-ups."}
};
const total=P=>(P.lastWeek-1)*P.dpw;
function info(P,lift,tier,s){
 if(P.mode==="stage"){const t=P.tiers[tier];return{scheme:t.schemes[s-1],target:t.targets[s-1]}}
 const t=P.lifts[lift].t;return{scheme:"3×"+t+"+",target:t};
}
function advance(P,lift,tier,w,s,reps){
 const i=info(P,lift,tier,s),j=P.lifts[lift].jump,hit=reps>=i.target;
 if(P.mode==="stage"){
  const t=P.tiers[tier];
  if(hit)return{w:w+j*(t.dbl&&reps>=i.target+3?2:1),s,hit};
  if(s<3)return{w,s:s+1,hit};
  return{w:r25(w*t.reset),s:1,hit};
 }
 if(hit)return{w:w+j*(reps>=i.target+3?2:1),s:0,hit};
 if(s===0)return{w,s:1,hit};
 return{w:r25(w*.9),s:0,hit};
}

/* ---------- state + storage ---------- */
let S=null,tab="today",timerEnd=0,timerTick=null,confirmKey="",saveNote="",dbRef=null,saveT=null;
const blank=()=>({p:"a",d:{a:{starts:{},sessions:[],draft:null},g:{starts:{},sessions:[],draft:null}}});
function normalise(x){const b=blank();if(!x||typeof x!=="object")return b;
 if(x.p==="a"||x.p==="g")b.p=x.p;
 for(const k of["a","g"]){const s=x.d&&x.d[k];if(s){b.d[k].starts=s.starts||{};b.d[k].sessions=Array.isArray(s.sessions)?s.sessions:[];b.d[k].draft=s.draft||null}}
 return b}
function lsGet(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){
 lsSet();
 if(!dbRef)return;
 clearTimeout(saveT);
 saveT=setTimeout(async()=>{try{await dbRef.set(JSON.parse(JSON.stringify(S)));saveNote="Saved";}catch(e){saveNote="Saved on this device only";}paintStatus()},500);
}
function snapData(snap){
 if(!snap)return null;
 if(typeof snap.exists==="function"&&!snap.exists())return null;
 if(snap.exists===false)return null;
 const d=typeof snap.data==="function"?snap.data():(snap.data!==undefined?snap.data:snap);
 return d&&typeof d==="object"&&d.d?d:null;
}
async function initDb(){
 try{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  dbRef=db.collection("data/users/"+id).doc("tracker");
  const remote=snapData(await dbRef.get());
  if(remote){
   const r=normalise(remote),l=S;
   const rn=r.d.a.sessions.length+r.d.g.sessions.length,ln=l.d.a.sessions.length+l.d.g.sessions.length;
   if(rn>=ln){S=r;lsSet();render()}else save();
  }else if(S.d.a.sessions.length||S.d.g.sessions.length||Object.keys(S.d.a.starts).length||Object.keys(S.d.g.starts).length)save();
  saveNote="Synced";paintStatus();
 }catch(e){dbRef=null}
}

/* ---------- derived ---------- */
const P=()=>PROGS[S.p],D=()=>S.d[S.p];
function startsOk(){const p=P(),d=D();return p.startLifts.every(l=>parseFloat(d.starts[l])>0)}
function replay(){
 const p=P(),d=D(),st={};
 if(startsOk())for(const [l,t] of p.slots())st[l+"|"+t]={w:p.startW(l,t,parseFloat(d.starts[l])),s:p.mode==="stage"?1:0};
 for(const ses of d.sessions)for(const e of ses.e){const r=advance(p,e.l,e.t,e.w,e.s,e.r);st[e.l+"|"+e.t]={w:r.w,s:r.s}}
 return st;
}
function draftFor(n){const d=D();if(!d.draft||d.draft.n!==n)d.draft={n,v:{}};return d.draft}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const p=P();
 let body="";
 if(tab==="today")body=viewToday();else if(tab==="progress")body=viewProgress();else if(tab==="history")body=viewHistory();else body=viewSetup();
 $("#app").innerHTML=
  `<div class="hdr"><h1>Lift Tracker</h1><span class="pill">${esc(p.sub)}</span></div>
   <div class="seg">${["a","g"].map(k=>`<button data-act="prof" data-k="${k}" class="${S.p===k?"on":""}">${PROGS[k].name}</button>`).join("")}</div>
   ${body}
   <div class="status" id="status"></div>
   ${tab==="today"?timerBar():""}
   <div class="tabs">${[["today","Today"],["progress","Progress"],["history","History"],["setup","Setup"]].map(([k,l])=>`<button data-act="tab" data-k="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div>`;
 paintStatus();paintTimer();
}
function paintStatus(){const e=$("#status");if(e)e.textContent=saveNote}
function viewToday(){
 const p=P(),d=D();
 if(!startsOk())return`<div class="card"><b>Enter your start weights first</b><p class="sub">${esc(p.help)}</p><button class="primary" data-act="tab" data-k="setup">Go to Setup</button></div>`;
 const n=d.sessions.length;
 if(n>=total(p))return`<div class="card"><b>Phase complete — nice work.</b><p class="sub">All ${total(p)} sessions are logged. Check Progress for your final weights.</p></div>`;
 const week=Math.floor(n/p.dpw)+2,di=n%p.dpw,pl=p.plan(week,di),st=replay(),dr=draftFor(n);
 let h=`<p class="sub"><b>Week ${week}</b> · ${esc(pl.title)} · session ${n+1} of ${total(p)}. Reps are pre-filled at the target: change them to what you actually got on the last set.</p>`;
 for(const [l,t] of pl.ex){
  const k=l+"|"+t,s0=st[k],v=dr.v[k]||{},w=v.w!==undefined?v.w:s0.w,i=info(p,l,t,s0.s),reps=v.r!==undefined?v.r:i.target,res=advance(p,l,t,w,s0.s,reps);
  let msg,cls;
  if(res.hit){msg=`✓ Target hit → next ${fmt(res.w)} kg`+(res.w-w>p.lifts[l].jump?" (big jump)":"");cls="ok"}
  else if(res.w<w){msg=`✗ Missed → reset to ${fmt(res.w)} kg`;cls="bad"}
  else if(p.mode==="stage"){msg=`✗ Missed → same weight, next stage ${info(p,l,t,res.s).scheme}`;cls="bad"}
  else{msg="✗ Missed → repeat this weight";cls="bad"}
  h+=`<div class="card"><div class="row"><span class="lift">${esc(l)}</span><span class="tag">${t?t+" · ":""}${esc(i.scheme)}</span></div>
   <div class="stepper"><span class="lbl">Weight</span><button class="btn" data-act="wm" data-k="${esc(k)}">−</button><div class="val">${fmt(w)}<small> kg</small></div><button class="btn" data-act="wp" data-k="${esc(k)}">+</button></div>
   <div class="stepper"><span class="lbl">Reps, last set<br>(target ${i.target})</span><button class="btn" data-act="rm" data-k="${esc(k)}">−</button><div class="val">${reps}</div><button class="btn" data-act="rp" data-k="${esc(k)}">+</button></div>
   <div class="note ${cls}">${msg}</div></div>`;
 }
 h+=`<div class="acc"><b>Accessories:</b> ${esc(pl.acc)}</div><button class="primary" data-act="finish">Finish session</button>`;
 return h;
}
function viewProgress(){
 const p=P(),d=D();
 if(!startsOk())return`<div class="card">Enter start weights in Setup to see progress.</div>`;
 const st=replay();
 let rows="";
 for(const [l,t] of p.slots()){
  const s=st[l+"|"+t],base=p.startW(l,t,parseFloat(d.starts[l])),i=info(p,l,t,s.s);
  rows+=`<tr><td>${esc(l)}${t?" <span class='tag'>"+t+"</span>":""}</td><td class="n">${fmt(s.w)} kg</td><td>${esc(i.scheme)}</td><td class="n" style="color:var(--${s.w>=base?"ok":"bad"})">${s.w>=base?"+":""}${fmt(s.w-base)}</td></tr>`;
 }
 return`<div class="card"><table><tr><th>Lift</th><th>Next weight</th><th>Scheme</th><th>vs start</th></tr>${rows}</table></div>
  <div class="card"><b>${d.sessions.length}</b> of ${total(p)} sessions done.</div>`;
}
function viewHistory(){
 const p=P(),d=D();
 if(!d.sessions.length)return`<div class="card">No sessions logged yet.</div>`;
 let h="";
 d.sessions.slice().reverse().forEach((s,ri)=>{
  const idx=d.sessions.length-1-ri;
  h+=`<div class="card"><div class="row"><b>Week ${s.wk} · Day ${s.di+1}</b><span class="tag">${esc(s.date)}</span></div>`+
   s.e.map(e=>{const i=info(p,e.l,e.t,e.s);return`<div class="row" style="margin-top:6px"><span>${esc(e.l)}${e.t?" <span class='tag'>"+e.t+"</span>":""}</span><span>${fmt(e.w)} kg × ${e.r} <span style="color:var(--${e.r>=i.target?"ok":"bad"})">${e.r>=i.target?"✓":"✗"}</span></span></div>`}).join("")+
   (idx===d.sessions.length-1?`<button class="ghost danger" style="margin-top:10px" data-act="undo">${confirmKey==="undo"?"Tap again to undo this session":"Undo this session"}</button>`:"")+`</div>`;
 });
 return h;
}
function viewSetup(){
 const p=P(),d=D();
 return`<div class="card"><b>Start weights (kg) — ${esc(p.name)}</b><p class="sub">${esc(p.help)}</p>
  ${p.startLifts.map(l=>`<div class="row" style="margin:8px 0"><span class="lift" style="font-size:18px">${esc(l)}</span><input type="number" inputmode="decimal" step="2.5" min="0" data-start="${esc(l)}" value="${d.starts[l]??""}" placeholder="kg"></div>`).join("")}
  <p class="sub">Changing these after you've started only affects lifts with no logged sessions yet; logged weights stay as they were.</p></div>
  <div class="card"><b>Backup</b><p class="sub">Your data saves to your Claude account when signed in, and on this device. To move it elsewhere, copy the text below.</p>
  <textarea id="bk" spellcheck="false" placeholder="Export fills this box. Paste a backup here to import."></textarea>
  <div class="row" style="margin-top:8px"><button class="ghost" data-act="export">Export</button><button class="ghost" data-act="import">Import</button><button class="ghost danger" data-act="reset">${confirmKey==="reset"?"Tap again to erase "+esc(p.name):"Reset "+esc(p.name)}</button></div></div>`;
}
function timerBar(){return`<div class="timer"><b id="tm">0:00</b><button data-act="timer" data-k="90">1:30</button><button data-act="timer" data-k="120">2:00</button><button data-act="timer" data-k="180">3:00</button><button data-act="timer" data-k="0">Stop</button><span style="flex:1;text-align:right;font-size:13px;opacity:.75">Rest</span></div>`}
function paintTimer(){
 const e=$("#tm");if(!e)return;
 const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
 e.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
 if(timerEnd&&left===0){timerEnd=0;beep()}
}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},500)}catch(e){}}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-act]");if(!el)return;
 const a=el.dataset.act,k=el.dataset.k,p=P(),d=D();
 if(a==="tab"){tab=k;confirmKey="";render();window.scrollTo(0,0);return}
 if(a==="prof"){S.p=k;confirmKey="";save();render();return}
 if(a==="timer"){timerEnd=+k?Date.now()+(+k)*1000:0;clearInterval(timerTick);timerTick=setInterval(paintTimer,500);paintTimer();return}
 if(a==="wm"||a==="wp"||a==="rm"||a==="rp"){
  const st=replay(),n=d.sessions.length,dr=draftFor(n),[l,t]=k.split("|"),s0=st[k],v=dr.v[k]=dr.v[k]||{};
  if(a==="wm"||a==="wp"){const w=v.w!==undefined?v.w:s0.w;v.w=Math.max(0,w+(a==="wp"?2.5:-2.5))}
  else{const i=info(p,l,t,s0.s),r=v.r!==undefined?v.r:i.target;v.r=Math.max(0,Math.min(60,r+(a==="rp"?1:-1)))}
  save();render();return;
 }
 if(a==="finish"){
  const st=replay(),n=d.sessions.length,week=Math.floor(n/p.dpw)+2,di=n%p.dpw,pl=p.plan(week,di),dr=draftFor(n),e=[];
  for(const [l,t] of pl.ex){const k=l+"|"+t,s0=st[k],v=dr.v[k]||{},i=info(p,l,t,s0.s);e.push({l,t,w:v.w!==undefined?v.w:s0.w,s:s0.s,r:v.r!==undefined?v.r:i.target})}
  d.sessions.push({wk:week,di,date:new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short"}),e});
  d.draft=null;timerEnd=0;save();window.scrollTo(0,0);render();return;
 }
 if(a==="undo"){if(confirmKey!=="undo"){confirmKey="undo";render();return}d.sessions.pop();d.draft=null;confirmKey="";save();render();return}
 if(a==="reset"){if(confirmKey!=="reset"){confirmKey="reset";render();return}S.d[S.p]={starts:{},sessions:[],draft:null};confirmKey="";save();render();return}
 if(a==="export"){$("#bk").value=JSON.stringify(S);$("#bk").select();return}
 if(a==="import"){try{const x=JSON.parse($("#bk").value);S=normalise(x);save();render()}catch(e){saveNote="That backup couldn't be read";paintStatus()}return}
});
document.addEventListener("change",ev=>{
 const el=ev.target;if(el.dataset&&el.dataset.start!==undefined){
  const v=parseFloat(el.value),d=D();
  if(v>0)d.starts[el.dataset.start]=r25(v);else delete d.starts[el.dataset.start];
  save();render();
 }
});

S=normalise(lsGet());
render();
initDb();
</script>
</body>
</html>
